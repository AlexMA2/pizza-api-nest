name: Deploy NestJS Container to AWS Lambda

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Log in to AWS using the provided credentials
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # Log in to AWS Elastic Container Registry (ECR)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Ensure the ECR repository exists before pushing to it
      - name: Create ECR Repository if not exists
        env:
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME || 'your-menu' }}
        run: |
          aws ecr create-repository --repository-name $ECR_REPOSITORY || echo "Repository already exists or creation skipped"

      # Build the Lambda-compatible Docker image and push it to ECR
      - name: Build, Tag, and Push Image to Amazon ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY_NAME || 'your-menu' }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build the container using the Lambda-specific Dockerfile
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest -f Dockerfile.lambda .
          
          # Push both the commit-specific tag and the 'latest' tag
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Save the image URI for the next step
          echo "IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      # Ensure the Lambda function exists and is configured as a Container Image type
      - name: Setup Lambda Function (Recreate if it is ZIP type)
        env:
          FUNCTION_NAME: your-menu
          IMAGE_URI: ${{ env.IMAGE_URI }}
        run: |
          # Check if the function exists
          FUNC_EXISTS=$(aws lambda get-function --function-name $FUNCTION_NAME 2>&1 || true)
          
          if [[ "$FUNC_EXISTS" == *"ResourceNotFoundException"* ]]; then
            echo "Error: Lambda function does not exist. Please create the function 'your-menu' first in AWS Console as an Image type."
            exit 1
          else
            # Check package type
            PACKAGE_TYPE=$(aws lambda get-function-configuration --function-name $FUNCTION_NAME --query 'PackageType' --output text)
            if [ "$PACKAGE_TYPE" = "Zip" ]; then
              echo "Existing function is a ZIP type. Automatically fetching its existing Role ARN..."
              
              # Fetch the active execution role ARN from the existing function
              EXISTING_ROLE=$(aws lambda get-function-configuration --function-name $FUNCTION_NAME --query 'Role' --output text)
              echo "Found existing execution role: $EXISTING_ROLE"
              
              echo "Deleting and recreating function as Container Image type using the existing Role..."
              aws lambda delete-function --function-name $FUNCTION_NAME
              
              # Wait for deletion to propagate
              sleep 5
              
              aws lambda create-function \
                --function-name $FUNCTION_NAME \
                --package-type Image \
                --code ImageUri=$IMAGE_URI \
                --role $EXISTING_ROLE
                
              echo "Waiting for the new function to be active..."
              aws lambda wait function-active-v2 --function-name $FUNCTION_NAME
            else
              echo "Existing function is already an Image type. Proceeding to update function code..."
              aws lambda update-function-code \
                --function-name $FUNCTION_NAME \
                --image-uri $IMAGE_URI
                
              echo "Waiting for the function code update to complete..."
              aws lambda wait function-updated-v2 --function-name $FUNCTION_NAME
            fi
          fi

      # Update the Lambda environment variables dynamically using AWS CLI
      - name: Update Lambda Environment Configuration
        run: |
          # Ensure any ongoing updates are completed before configuring environment variables
          aws lambda wait function-updated-v2 --function-name your-menu
          
          aws lambda update-function-configuration \
            --function-name your-menu \
            --environment "Variables={NODE_ENV=production,DB_HOST=${{ secrets.DB_HOST }},DB_PORT=${{ secrets.DB_PORT }},DB_USERNAME=${{ secrets.DB_USERNAME }},DB_PASSWORD=${{ secrets.DB_PASSWORD }},DB_NAME=${{ secrets.DB_NAME }},JWT_SECRET=${{ secrets.JWT_SECRET }},JWT_EXPIRES_IN=${{ secrets.JWT_EXPIRES_IN }},CORS_ORIGIN=${{ secrets.CORS_ORIGIN }},AWS_S3_BUCKET=${{ secrets.AWS_S3_BUCKET }}}"
